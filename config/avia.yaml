common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # ==========================================
  # 修改：相机的外参标定 (LiDAR -> Camera)
  # 注意：Pcl 的单位已从 mm 转换为 m
  # ==========================================
  Rcl: [-0.005798300026, -0.999971493093, -0.004836601820,  # LiDAR 到 Camera 的旋转矩阵，按行展开
        -0.011715325081,  0.004904280506, -0.999919346343,
        0.999914561788, -0.005741170009, -0.011743427603]

  Pcl: [ 0.002989462479,  # LiDAR 到 Camera 的平移向量，单位 m
        0.075547138553,
        -0.001093386747]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # 1：livox custom  2：pointcloud2
  scan_line: 6
  blind: 0.1
  max_range: 50.0 # 米；以雷达为原点的三维距离，超过此距离的点不参与建图（设为 0 则关闭过滤）

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 50
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  viz_voxel_size: 0.25 # RViz-only display voxel; does not affect LIO/VIO/map estimation
  viz_publish_interval: 3 # publish one display cloud every 3 available visual clouds

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  type: 0 # colored world-frame background map (XYZRGB), output-only
  colmap_output_en: false # colored PCD does not require per-frame COLMAP image export
  filter_size_pcd: 0.20 # each saved colored chunk uses 0.20 m voxels; estimator is unchanged
  max_points_per_voxel: 10 # each chunk keeps at most 10 XYZRGB points per voxel
  interval: 50 # save one independent compressed colored PCD chunk every 50 LiDAR frames
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
