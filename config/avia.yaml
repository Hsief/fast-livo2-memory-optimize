common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # ==========================================
  # 修改：相机的外参标定 (LiDAR -> Camera)
  # 注意：Pcl 的单位已从 mm 转换为 m
  # ==========================================
  Rcl: [-0.005798300026, -0.999971493093, -0.004836601820,  # LiDAR 到 Camera 的旋转矩阵，按行展开
        -0.011715325081,  0.004904280506, -0.999919346343,
        0.999914561788, -0.005741170009, -0.011743427603]

  Pcl: [ 0.002989462479,  # LiDAR 到 Camera 的平移向量，单位 m
        0.075547138553,
        -0.001093386747]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 2  # Xavier NX: halve raw Avia points before downstream processing
  filter_size_surf: 0.1
  lidar_type: 1 # 1：livox custom  2：pointcloud2
  scan_line: 6
  blind: 0.1

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 50
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false  # publish downsampled cloud; avoids saturating RViz/DRAM
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: false  # IMPORTANT: interval=-1 otherwise accumulates the whole map in RAM
  type: 0 # 0: Static colored world map, 1: Body frame intensity, 2: World frame intensity
  colmap_output_en: false # enable only for offline export; it increases memory/I/O pressure
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1

# Xavier NX 6GB real-time safety limits.
# Old sensor data is intentionally dropped if the estimator cannot keep up:
# bounded latency is preferred over an ever-growing backlog.
runtime:
  lidar_sub_queue_size: 4
  imu_sub_queue_size: 800
  image_sub_queue_size: 3
  max_lidar_buffer_size: 4
  max_image_buffer_size: 3
  max_imu_buffer_size: 1600
  max_prop_imu_buffer_size: 1600
  path_max_poses: 1500
  path_pub_interval: 5
  diagnostics_interval_sec: 1.0
